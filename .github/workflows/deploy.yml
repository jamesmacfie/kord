name: Deploy

# Every push to main is checked, built, and deployed to the kord Worker.
# The domain lives in the KORD_DOMAIN secret rather than in this file, so the
# repository never names where the app is hosted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A second push while one deploy is running waits for it to finish, so two
# deploys never race and the newest commit always lands last.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run check

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test
        run: npm run test

      # The Cloudflare Vite plugin only loads in production mode, so this is
      # the build that produces the Worker wrangler deploys.
      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KORD_DOMAIN: ${{ secrets.KORD_DOMAIN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KORD_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name repository secret is not set."
              exit 1
            fi
          done
          npx wrangler deploy --domain "$KORD_DOMAIN"
